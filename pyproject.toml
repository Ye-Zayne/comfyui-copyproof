[project]
name = "comfyui-copyproof"
version = "0.1.0"
description = "Chinese commercial-copy verification with OCR evidence, field matching, review verdicts and repair masks."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ye-Zayne"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/Ye-Zayne/comfyui-copyproof"
"Bug Tracker" = "https://github.com/Ye-Zayne/comfyui-copyproof/issues"

[tool.comfy]
PublisherId = "jinny-wj"
DisplayName = "CopyProof"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.optional-dependencies]
ocr = ["rapidocr>=3.0,<4", "onnxruntime>=1.17,<2"]
